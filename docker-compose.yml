# MySQL 8 for local development and integration tests.
# Usage:
#   docker compose up -d
#   cargo test --test integration -- --test-threads=1
#
# Credentials match tests/integration.rs (root / rootpassword).

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-binlog-monitor-test
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
